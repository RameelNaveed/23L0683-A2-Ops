<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="dot"></span>VisionGuard</a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Upload</a>
      <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">History</a>
      <a href="{{ url_for('health') }}">Health</a>
    </nav>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="foot">VisionGuard &middot; AI vs real image classifier &middot; MLOps Assignment 2</footer>
</body>
</html>
