# Task 6.3: whole system with one command:  docker compose up -d --build
name: visionguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" section on purpose. The database is only reachable inside the
    # Compose network, as host name "db". Nothing outside can connect to 5432.

  web:
    build: .
    image: visionguard-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy           # wait until Postgres answers pg_isready
    environment:
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      MODEL_PATH: /models/champion.keras
      MODEL_VERSION: ${MODEL_VERSION:-champion}
      THRESHOLD: ${THRESHOLD:-0.5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      # "db" is the service name; Compose's internal DNS resolves it to the db container.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./models:/models:ro                  # model mounted read only, not baked into the image
    ports:
      - "5000:5000"

volumes:
  pgdata:
